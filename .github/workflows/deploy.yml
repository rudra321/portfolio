name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: |
          echo "chat endpoint configured: ${NEXT_PUBLIC_CHAT_ENDPOINT:-NO — building local-engine-only}"
          npm run build
        env:
          # Optional — set the CHAT_ENDPOINT repo secret (the Worker URL) to take
          # the live LLM tiers live. Unset = the chat runs on the in-browser local
          # engine (still fully usable). Provider API keys live in the Worker, never
          # here — this is only ever a URL, never a key in the bundle.
          # Accepts either name, as a repo secret or a repo variable.
          NEXT_PUBLIC_CHAT_ENDPOINT: ${{ secrets.CHAT_ENDPOINT || secrets.NEXT_PUBLIC_CHAT_ENDPOINT || vars.CHAT_ENDPOINT || vars.NEXT_PUBLIC_CHAT_ENDPOINT }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
